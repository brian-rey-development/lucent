name: Feature request
description: A verb, a check or a capability Lucent is missing.
labels: [request]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to show or check, and what stops you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How it could look in a .lucent.md file.
  - type: textarea
    id: budgets
    attributes:
      label: Budgets
      description: Any effect on the budgets in docs/goals.md (tokens, check latency, render time).
